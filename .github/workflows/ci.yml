name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  file-size-check:
    name: File Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check file sizes
        run: ./scripts/check-file-size.sh

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest

    # only-new-issues reads the PR diff through the GitHub API.
    permissions:
      contents: read
      pull-requests: read

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The push lint step diffs against the parent commit (HEAD~1).
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Check coverage
        run: |
          go tool cover -func=coverage.out | grep total | awk '{print $3}'

      # The backend carries a pre-existing lint baseline (see "Go lint baseline"
      # in CLAUDE.md), so CI blocks NEW issues only.
      - name: Run linter (new issues in this PR)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: backend
          only-new-issues: true

      - name: Run linter (new issues since the parent commit)
        if: github.event_name == 'push'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: backend
          args: --new-from-rev=HEAD~1

      - name: Build
        run: go build -v ./cmd/api

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  skill:
    name: Agent Skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Transport regressions
        run: python3 skill/scripts/test_transport.py
      - name: Shell contracts and published distribution
        run: |
          for test in skill/scripts/test_*.sh; do
            bash "$test"
          done
