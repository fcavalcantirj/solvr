# golangci-lint configuration for Solvr backend (golangci-lint v2 format)
# Docs: https://golangci-lint.run/docs/configuration/
# Migrated from the v1 format with `golangci-lint migrate`; same linters and settings.
# CI blocks NEW issues only — see "Go lint baseline" in CLAUDE.md.

version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  # `standard` = errcheck, govet, ineffassign, staticcheck, unused (the v1 defaults).
  default: standard
  enable:
    - errcheck      # Check for unchecked errors
    - govet         # Report suspicious constructs
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Static analysis checks (v2 merged gosimple into it)
    - unused        # Check for unused code
    - misspell      # Check for misspelled words
    - unconvert     # Remove unnecessary type conversions
    - gocritic      # Opinionated linter
    - revive        # Fast, configurable linter
    - gosec         # Security checks
    - bodyclose     # Check HTTP response body is closed
    - noctx         # Check context is passed to HTTP requests

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - whyNoLint  # Allow //nolint without explanation during development

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf

    gosec:
      excludes:
        - G104  # Allow unhandled errors in deferred calls during development

  # No exclusion presets: the v1 config had `exclude-use-default: false`.
  exclusions:
    generated: lax
    rules:
      # Allow unused code and skip security checks in test files
      - path: _test\.go
        linters:
          - unused
          - gosec

      # Allow dot imports in tests
      - path: _test\.go
        text: dot-imports

      # Allow package comments to be optional for internal packages
      - path: internal/
        text: should have a package comment

formatters:
  enable:
    - gofmt      # Check formatting
    - goimports  # Check import ordering
  settings:
    goimports:
      local-prefixes:
        - github.com/fcavalcantirj/solvr
  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
  # v2 always sorts results (v1 `sort-results: true`).
